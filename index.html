<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minimalist To-Do</title>
<style>
    /* ===== Shared design tokens (identical to calculator / converter / clock) ===== */
    :root {
        --bg-color: #1a1a2e;
        --bg-glow: #16213e;
        --panel: rgba(255, 255, 255, 0.05);
        --panel-border: rgba(255, 255, 255, 0.10);
        --btn-bg: rgba(255, 255, 255, 0.08);
        --btn-hover: rgba(255, 255, 255, 0.16);
        --accent: #e94560;
        --accent-hover: #d83b54;
        --accent-soft: rgba(233, 69, 96, 0.35);
        --text-main: #ffffff;
        --text-muted: #a0a0b0;
    }

    body[data-theme="ocean"] {
        --bg-color: #08131f;
        --bg-glow: #0b3b52;
        --accent: #38bdf8;
        --accent-hover: #0ea5e9;
        --accent-soft: rgba(56, 189, 248, 0.35);
    }

    body[data-theme="violet"] {
        --bg-color: #100d1c;
        --bg-glow: #2e1065;
        --accent: #a78bfa;
        --accent-hover: #8b5cf6;
        --accent-soft: rgba(167, 139, 250, 0.35);
    }

    body[data-theme="amber"] {
        --bg-color: #17120a;
        --bg-glow: #422006;
        --accent: #fbbf24;
        --accent-hover: #f59e0b;
        --accent-soft: rgba(251, 191, 36, 0.35);
    }

    * { box-sizing: border-box; }

    body {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        margin: 0;
        padding: 48px 16px;
        background: radial-gradient(circle at top left, var(--bg-glow), var(--bg-color));
        background-color: var(--bg-color);
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: var(--text-main);
        transition: background-color .35s ease;
    }

    .page {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        width: 100%;
        max-width: 420px;
    }

    /* ===== Card (padding / radius / shadow matches the converter) ===== */
    .todo-card {
        width: 100%;
        padding: 20px 22px 24px;
        background: var(--panel);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }

    /* ===== Theme dots (identical to converter) ===== */
    .theme-bar {
        display: flex;
        justify-content: flex-end;
        gap: 7px;
        margin-bottom: 4px;
    }
    .theme-dot {
        width: 10px;
        height: 10px;
        padding: 0;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        opacity: .55;
        transition: transform .2s ease, opacity .2s ease, box-shadow .2s ease;
    }
    .theme-dot:hover { transform: scale(1.3); opacity: 1; }
    .theme-dot.active { opacity: 1; box-shadow: 0 0 0 2px rgba(255,255,255,0.85); }
    .theme-dot[data-theme="rose"]   { background: #e94560; }
    .theme-dot[data-theme="ocean"]  { background: #38bdf8; }
    .theme-dot[data-theme="violet"] { background: #a78bfa; }
    .theme-dot[data-theme="amber"]  { background: #fbbf24; }

    /* ===== Header (same as converter) ===== */
    h2 {
        margin: 2px 0 18px;
        font-size: 1.1rem;
        font-weight: 600;
        text-align: center;
        letter-spacing: 0.6px;
    }

    /* ===== Input row ===== */
    .input-row {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
    }

    .task-input {
        flex: 1;
        min-width: 0;
        padding: 13px 14px;
        background: rgba(0, 0, 0, 0.30);
        border: 1px solid rgba(255, 255, 255, 0.10);
        border-radius: 13px;
        color: var(--text-main);
        font-family: inherit;
        font-size: 0.95rem;
        outline: none;
        transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }
    .task-input::placeholder { color: var(--text-muted); }
    .task-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
        background: rgba(0, 0, 0, 0.42);
    }

    /* Add button mirrors the calculator's .generate-btn */
    .add-btn {
        flex: 0 0 auto;
        padding: 0 20px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 12px;
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: background .18s ease, transform .1s ease, box-shadow .18s ease;
        box-shadow: 0 4px 14px var(--accent-soft);
    }
    .add-btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .add-btn:active, .add-btn.pressed { transform: scale(0.95); }
    .add-btn:focus-visible { box-shadow: 0 0 0 2px var(--accent); }

    /* ===== Filters (same pill pattern as converter tabs) ===== */
    .filters {
        display: flex;
        gap: 5px;
        padding: 5px;
        margin-bottom: 14px;
        background: rgba(0, 0, 0, 0.28);
        border-radius: 12px;
    }
    .filter {
        flex: 1;
        padding: 8px 0;
        border: none;
        background: transparent;
        color: var(--text-muted);
        font-family: inherit;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.3px;
        border-radius: 8px;
        cursor: pointer;
        transition: background .2s ease, color .2s ease, transform .1s ease;
    }
    .filter:hover { color: var(--text-main); background: rgba(255,255,255,0.06); }
    .filter.active { background: var(--accent); color: #fff; box-shadow: 0 4px 14px var(--accent-soft); }
    .filter.pressed { transform: scale(0.95); }
    .filter:focus-visible { box-shadow: 0 0 0 2px var(--accent); }

    /* ===== Task list ===== */
    .task-list {
        list-style: none;
        padding: 0;
        margin: 0;
        max-height: 380px;
        overflow-y: auto;
        scrollbar-width: thin;
    }
    .task-list::-webkit-scrollbar { width: 6px; }
    .task-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

    /* Items now use --btn-bg / --btn-hover — the same tokens as every button */
    .task-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 12px;
        margin-bottom: 6px;
        background: var(--btn-bg);
        border: 1px solid transparent;
        border-radius: 12px;
        animation: slideIn .25s ease;
        transition: background .2s ease, border-color .2s ease, opacity .25s ease, transform .25s ease;
    }
    .task-item:hover { background: var(--btn-hover); border-color: rgba(255,255,255,0.06); }
    .task-item.removing { opacity: 0; transform: translateX(40px); }
    .task-item.done .task-text {
        color: var(--text-muted);
        text-decoration: line-through;
        text-decoration-color: var(--text-muted);
    }

    @keyframes slideIn {
        from { opacity: 0; transform: translateY(-6px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .checkbox {
        flex: 0 0 auto;
        width: 20px;
        height: 20px;
        border: 2px solid var(--text-muted);
        border-radius: 6px;
        cursor: pointer;
        position: relative;
        transition: background .2s ease, border-color .2s ease;
    }
    .checkbox:hover { border-color: var(--accent); }
    .checkbox.checked { background: var(--accent); border-color: var(--accent); }
    .checkbox.checked::after {
        content: '';
        position: absolute;
        left: 5px;
        top: 1px;
        width: 6px;
        height: 11px;
        border: solid #fff;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
    }

    .task-text {
        flex: 1;
        font-size: 0.92rem;
        line-height: 1.35;
        word-break: break-word;
        cursor: pointer;
        user-select: none;
    }

    .task-edit {
        flex: 1;
        min-width: 0;
        padding: 4px 8px;
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid var(--accent);
        border-radius: 6px;
        color: var(--text-main);
        font-family: inherit;
        font-size: 0.92rem;
        outline: none;
    }

    .del-btn {
        flex: 0 0 auto;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        border-radius: 50%;
        color: var(--text-muted);
        font-size: 1rem;
        cursor: pointer;
        opacity: 0;
        transition: background .2s ease, color .2s ease, opacity .2s ease, transform .1s ease;
    }
    .task-item:hover .del-btn { opacity: 1; }
    .del-btn:hover { background: var(--accent-soft); color: var(--accent); }
    .del-btn:active { transform: scale(0.9); }
    .del-btn:focus-visible { opacity: 1; box-shadow: 0 0 0 2px var(--accent); }

    .empty-state {
        text-align: center;
        padding: 28px 12px;
        color: var(--text-muted);
        font-size: 0.85rem;
        font-style: italic;
    }

    /* ===== Bottom row ===== */
    .bottom-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        font-size: 0.78rem;
        color: var(--text-muted);
    }

    .clear-btn {
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-family: inherit;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.3px;
        cursor: pointer;
        padding: 6px 10px;
        border-radius: 8px;
        transition: background .18s ease, color .18s ease, transform .1s ease;
    }
    .clear-btn:hover { background: var(--btn-bg); color: var(--accent); }
    .clear-btn:active { transform: scale(0.95); }
    .clear-btn:disabled { opacity: 0.35; cursor: default; }
    .clear-btn:disabled:hover { background: transparent; color: var(--text-muted); }
    .clear-btn:focus-visible { box-shadow: 0 0 0 2px var(--accent); }

    /* ===== Footer (identical to the other apps) ===== */
    .footer {
        font-size: 0.8rem;
        letter-spacing: 0.4px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 5px;
        opacity: .85;
    }
    .footer .heart {
        display: inline-block;
        font-size: 0.95rem;
        animation: beat 1.6s ease-in-out infinite;
    }
    @keyframes beat {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.2); }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
    }
</style>
</head>
<body data-theme="rose">

<div class="page">
    <div class="todo-card">
        <div class="theme-bar" role="group" aria-label="Color theme">
            <button class="theme-dot active" data-theme="rose"   title="Rose"   aria-label="Rose theme"></button>
            <button class="theme-dot"        data-theme="ocean"  title="Ocean"  aria-label="Ocean theme"></button>
            <button class="theme-dot"        data-theme="violet" title="Violet" aria-label="Violet theme"></button>
            <button class="theme-dot"        data-theme="amber"  title="Amber"  aria-label="Amber theme"></button>
        </div>

        <h2>To-Do</h2>

        <div class="input-row">
            <input id="taskInput" class="task-input" type="text"
                   placeholder="What needs doing?" maxlength="200" autocomplete="off">
            <button id="addBtn" class="add-btn">Add</button>
        </div>

        <div class="filters" role="tablist" aria-label="Filter tasks">
            <button class="filter active" data-filter="all"    role="tab">All</button>
            <button class="filter"        data-filter="active" role="tab">Active</button>
            <button class="filter"        data-filter="done"   role="tab">Done</button>
        </div>

        <ul id="taskList" class="task-list"></ul>

        <div class="bottom-row">
            <span id="counter">0 tasks</span>
            <button id="clearBtn" class="clear-btn" disabled>Clear completed</button>
        </div>
    </div>

    <footer class="footer">
        Made with <span class="heart">❤️</span>
    </footer>
</div>

<script>
    const STORE = {
        tasks:  'todo-tasks',
        theme:  'todo-theme',
        filter: 'todo-filter'
    };

    const state = { tasks: [], filter: 'all' };

    const el = {
        input:    document.getElementById('taskInput'),
        addBtn:   document.getElementById('addBtn'),
        list:     document.getElementById('taskList'),
        counter:  document.getElementById('counter'),
        clearBtn: document.getElementById('clearBtn')
    };

    const filters = document.querySelectorAll('.filter');
    const themeDots = document.querySelectorAll('.theme-dot');

    /* ---------- Persistence ---------- */
    function save() {
        try {
            localStorage.setItem(STORE.tasks, JSON.stringify(state.tasks));
            localStorage.setItem(STORE.filter, state.filter);
        } catch (e) {}
    }

    function load() {
        let tasks = null, filter = null;
        try {
            tasks  = JSON.parse(localStorage.getItem(STORE.tasks) || 'null');
            filter = localStorage.getItem(STORE.filter);
        } catch (e) {}
        if (Array.isArray(tasks)) {
            state.tasks = tasks
                .filter(t => t && typeof t.text === 'string')
                .map(t => ({ id: t.id || (Date.now() + Math.random()), text: t.text, done: !!t.done }));
        }
        if (filter && ['all', 'active', 'done'].includes(filter)) state.filter = filter;
    }

    /* ---------- Rendering ---------- */
    function visibleTasks() {
        if (state.filter === 'active') return state.tasks.filter(t => !t.done);
        if (state.filter === 'done')   return state.tasks.filter(t => t.done);
        return state.tasks;
    }

    function render() {
        filters.forEach(f => f.classList.toggle('active', f.dataset.filter === state.filter));

        el.list.innerHTML = '';
        const vis = visibleTasks();

        if (vis.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'empty-state';
            empty.textContent =
                state.tasks.length === 0   ? 'Nothing here yet — add a task above.' :
                state.filter === 'active'  ? 'No active tasks. All done!' :
                                             'No completed tasks yet.';
            el.list.appendChild(empty);
        } else {
            vis.forEach(task => el.list.appendChild(buildItem(task)));
        }

        const remaining = state.tasks.filter(t => !t.done).length;
        const total     = state.tasks.length;
        const doneCount = total - remaining;

        el.counter.textContent =
            total === 0     ? '0 tasks' :
            remaining === 0 ? `All ${total} done ✓` :
                              `${remaining} of ${total} left`;

        el.clearBtn.disabled = doneCount === 0;
        el.clearBtn.textContent = doneCount > 0 ? `Clear completed (${doneCount})` : 'Clear completed';

        save();
    }

    function buildItem(task) {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.done ? ' done' : '');
        li.dataset.id = task.id;

        const cb = document.createElement('div');
        cb.className = 'checkbox' + (task.done ? ' checked' : '');
        cb.setAttribute('role', 'checkbox');
        cb.setAttribute('aria-checked', String(task.done));
        cb.tabIndex = 0;
        cb.addEventListener('click', () => toggle(task.id));
        cb.addEventListener('keydown', e => {
            if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(task.id); }
        });

        const text = document.createElement('span');
        text.className = 'task-text';
        text.textContent = task.text;
        text.title = 'Double-click to edit';
        text.addEventListener('dblclick', () => startEdit(li, task));

        const del = document.createElement('button');
        del.className = 'del-btn';
        del.textContent = '✕';
        del.title = 'Delete task';
        del.setAttribute('aria-label', 'Delete task');
        del.addEventListener('mousedown', e => e.preventDefault());
        del.addEventListener('click', () => removeTask(task.id));

        li.append(cb, text, del);
        return li;
    }

    /* ---------- Actions ---------- */
    function addTask() {
        const text = el.input.value.trim();
        if (!text) { el.input.focus(); return; }
        state.tasks.push({ id: Date.now() + Math.random(), text, done: false });
        el.input.value = '';
        render();
        el.input.focus();
    }

    function toggle(id) {
        const t = state.tasks.find(t => t.id === id);
        if (t) { t.done = !t.done; render(); }
    }

    function removeTask(id) {
        const li = el.list.querySelector(`[data-id="${id}"]`);
        const doRemove = () => { state.tasks = state.tasks.filter(t => t.id !== id); render(); };
        if (li) { li.classList.add('removing'); setTimeout(doRemove, 220); }
        else doRemove();
    }

    function clearCompleted() {
        const doneItems = el.list.querySelectorAll('.task-item.done');
        doneItems.forEach(li => li.classList.add('removing'));
        setTimeout(() => {
            state.tasks = state.tasks.filter(t => !t.done);
            render();
        }, doneItems.length ? 220 : 0);
    }

    function startEdit(li, task) {
        const textEl = li.querySelector('.task-text');
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'task-edit';
        input.value = task.text;
        input.maxLength = 200;

        let finished = false;
        function finish(saveChanges) {
            if (finished) return;
            finished = true;
            if (saveChanges) {
                const v = input.value.trim();
                if (v) task.text = v;
                else state.tasks = state.tasks.filter(t => t.id !== task.id);
            }
            render();
        }

        input.addEventListener('keydown', e => {
            if (e.key === 'Enter')  finish(true);
            else if (e.key === 'Escape') finish(false);
        });
        input.addEventListener('blur', () => finish(true));

        li.replaceChild(input, textEl);
        input.focus();
        input.select();
    }

    /* ---------- Events ---------- */
    el.addBtn.addEventListener('click', () => { addTask(); flash(el.addBtn); });

    el.input.addEventListener('keydown', e => {
        if (e.key === 'Enter') addTask();
        else if (e.key === 'Escape') { el.input.value = ''; el.input.blur(); }
    });

    filters.forEach(f => f.addEventListener('click', () => {
        state.filter = f.dataset.filter;
        render();
        flash(f);
    }));

    el.clearBtn.addEventListener('click', clearCompleted);

    /* ---------- Themes (identical pipeline to the other apps) ---------- */
    function applyTheme(theme) {
        document.body.dataset.theme = theme;
        themeDots.forEach(d => d.classList.toggle('active', d.dataset.theme === theme));
        try { localStorage.setItem(STORE.theme, theme); } catch (e) {}
    }
    themeDots.forEach(d => d.addEventListener('click', () => applyTheme(d.dataset.theme)));

    /* ---------- Keyboard shortcuts ---------- */
    function flash(btn) {
        if (!btn) return;
        btn.classList.add('pressed');
        setTimeout(() => btn.classList.remove('pressed'), 110);
    }

    window.addEventListener('keydown', e => {
        const typing = document.activeElement &&
                       ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName);
        if (typing) return;

        const k = e.key.toLowerCase();
        if (k === '/')      { e.preventDefault(); el.input.focus(); }
        else if (k === '1') { state.filter = 'all';    render(); flash(filters[0]); }
        else if (k === '2') { state.filter = 'active'; render(); flash(filters[1]); }
        else if (k === '3') { state.filter = 'done';   render(); flash(filters[2]); }
    });

    /* ---------- Init ---------- */
    load();
    try {
        const theme = localStorage.getItem(STORE.theme);
        if (theme && document.querySelector(`.theme-dot[data-theme="${theme}"]`)) applyTheme(theme);
    } catch (e) {}
    render();
    el.input.focus();
</script>
</body>
</html>
